name: Block Multi-Area Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate_single_area_changes:
    runs-on: ubuntu-latest
    name: Ensure PR touches only one area (frontend OR backend)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for changes in both folder1 and folder2
        run: |
          echo "🔍 Analyzing PR changes..."
          echo ""
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          
          # Check if folder1 was modified
          FOLDER1_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^folder1/" || true)
          
          # Check if folder2 was modified
          FOLDER2_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^folder2/" || true)
          
          echo "Files changed in folder1 (Frontend): $FOLDER1_CHANGED"
          echo "Files changed in folder2 (Backend): $FOLDER2_CHANGED"
          echo ""
          
          # Block if both areas are modified
          if [ $FOLDER1_CHANGED -gt 0 ] && [ $FOLDER2_CHANGED -gt 0 ]; then
            echo "❌ ERROR: This PR modifies BOTH frontend (folder1) and backend (folder2)"
            echo ""
            echo "❌ Pull requests must modify only ONE area at a time"
            echo ""
            echo "📖 For detailed instructions on how to fix this, see:"
            echo "   .github/TROUBLESHOOTING.md"
            echo ""
            echo "✅ Quick Solution: Split this PR into two separate PRs:"
            echo "   1. One PR for frontend (folder1) changes only"
            echo "   2. One PR for backend (folder2) changes only"
            echo ""
            echo "This ensures cleaner code reviews and easier debugging"
            exit 1
          elif [ $FOLDER1_CHANGED -gt 0 ]; then
            echo "✅ PASS: This PR contains only frontend (folder1) changes"
          elif [ $FOLDER2_CHANGED -gt 0 ]; then
            echo "✅ PASS: This PR contains only backend (folder2) changes"
          else
            echo "ℹ️  This PR doesn't modify folder1 or folder2"
            echo "✅ PASS: Other changes are allowed"
          fi

